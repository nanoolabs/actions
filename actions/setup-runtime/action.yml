name: "Setup Runtime"
description: "Setup Deno runtime with cache"
inputs:
  version:
    description: "Deno version (or auto-detect from .tool-versions/.dvmrc)"
    required: false
    type: string
    default: ""
  cache-key:
    description: "Custom cache key suffix"
    required: false
    type: string
    default: ""
outputs:
  deno-version:
    description: "Resolved Deno version"
    value: ${{ steps.resolve-version.outputs.version }}
  cache-hit:
    description: "Whether cache was hit"
    value: ${{ steps.cache-deno.outputs.cache-hit }}
permissions:
  contents: read
runs:
  using: "composite"
  steps:
    - name: Resolve Deno version
      id: resolve-version
      shell: bash
      run: ${{ github.action_path }}/resolve-version.sh
      env:
        VERSION: ${{ inputs.version }}

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ steps.resolve-version.outputs.version }}

    - name: Cache Deno
      id: cache-deno
      uses: actions/cache@v4
      with:
        path: ~/.cache/deno
        key: >-
          ${{ runner.os }}-deno-${{ steps.resolve-version.outputs.version }}-
          ${{ hashFiles('**/deno.lock', '**/import_map.json') }}-${{ inputs.cache-key }}
        restore-keys: |
          ${{ runner.os }}-deno-${{ steps.resolve-version.outputs.version }}-
