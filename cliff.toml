# Nanoo Labs standard git-cliff config
# Consumed by generate-changelog action (bundled default)

[changelog]
# Version lives in GitHub Release title only - no version in body
header = """
## Changelog
"""

# One [Full diff] link on top, terse commit lines, scope only when present
# Groups render in commit_parsers order via <!-- N --> sort hints
body = """
{% if previous.version and version %}[Full diff](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}){% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**[ ✖_✖ ] BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% endfor %}
{% endfor %}\n
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "newest"

# Kaomoji groups copied byte-for-byte from nanoolabs/kaomoji
# Inner padding intentional (glyph width alignment) - do not normalize
# <!-- N --> prefix = sort order hint stripped by striptags
commit_parsers = [
  { message = "^feat(\\(.*\\))?!?:", group = "<!-- 0 -->[ ^■^ ] Features" },
  { message = "^fix(\\(.*\\))?!?:", group = "<!-- 1 -->[ ;■_■ ] Bug Fixes" },
  { message = "^perf(\\(.*\\))?!?:", group = "<!-- 2 -->[ █_█ ] Performance" },
  { message = "^refactor(\\(.*\\))?!?:", group = "<!-- 3 -->[⌐■_■] Refactoring" },
  { message = "^build(\\(.*\\))?!?:", group = "<!-- 4 -->[ ▄_█ ] Build" },
  { message = "^doc(\\(.*\\))?s?:", group = "<!-- 5 -->[ ▦_▦ ] Documentation" },
  { message = "^style(\\(.*\\))?!?:", group = "<!-- 6 -->[ ▣_▣ ] Styling & UI" },
  { message = "^ci(\\(.*\\))?!?:", group = "<!-- 7 -->[ ☁_■ ] CI/CD" },
  { message = "^chore(\\(.*\\))?!?:", group = "<!-- 8 -->[ ▓_▓ ] Maintenance" },
  { message = "^test(\\(.*\\))?!?:", group = "<!-- 9 -->[ ¬■_■ ] Testing" },
  { message = ".*", group = "<!-- 10 -->[ □_□ ] Other" },
]

filter_commits = false

# One pattern matches all Nanoo schemes: semver, CalVer, prerelease, action tags
tag_pattern = "(?:release-action-)?v[0-9][0-9.]*(?:-[0-9a-zA-Z][0-9a-zA-Z.]*)?"
# Prereleases folded into next stable (no separate pre-release pages)
ignore_tags = "alpha|beta|rc|dev|next"

[remote.github]
owner = "nanoolabs"
repo = ""
