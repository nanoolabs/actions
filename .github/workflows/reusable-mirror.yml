# Reusable Codeberg Mirror
# CONTRACT:
# - type: reusable workflow
# - consumers: nanoolabs org repos
# - tag: reusable-mirror.yml@mirror-v1
# - inputs:
#     codeberg_repo_name (string, optional, default: github repo name)
# - secrets:
#     CODEBERG_TOKEN (require, forgejo token with repo write scope)
# - outputs: none
# - permissions: contents: write (via token)
# - security: HIGH - token has broad repo access
# - failure: fails on auth/network/push error, no retry

name: Reusable Codeberg Mirror

on:
  workflow_call:
    inputs:
      codeberg_repo_name:
        description: Target repo name on Codeberg (defaults to GitHub repo name)
        required: false
        type: string
        default: ""
    secrets:
      CODEBERG_TOKEN:
        description: Forgejo access token with repository write scope
        required: true

concurrency:
  group: mirror-${{ github.repository }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        uses: ./../../actions/mirror/push.sh
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO_NAME: ${{ inputs.codeberg_repo_name || github.event.repository.name }}
