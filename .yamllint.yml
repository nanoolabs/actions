extends: default

rules:
  truthy:
    check-keys: false
  line-length:
    max: 120
    level: warning
    allow-non-breakable-words: true
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: true
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0
  brackets:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
